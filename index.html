<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>TypeSprint | تعلم الكتابة السريعة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#typing-input">انتقل إلى منطقة الكتابة</a>

    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="6" width="20" height="12" rx="2" />
              <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8" />
            </svg>
          </span>
          <div>
            <h1>TypeSprint</h1>
            <p>تدريب الكتابة السريعة</p>
          </div>
        </div>

        <div class="topbar-actions">
          <div class="segmented" role="group" aria-label="اختيار اللغة">
            <button class="lang-btn active" data-language="arabic" type="button" aria-pressed="true">العربية</button>
            <button class="lang-btn" data-language="english" type="button" aria-pressed="false" lang="en">English</button>
          </div>

          <button id="theme-toggle" class="icon-btn" type="button" aria-label="تبديل الوضع الداكن">
            <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
          </button>
        </div>
      </header>

      <main class="dashboard">
        <section class="stats-panel" aria-label="الإحصائيات">
          <div class="stat-card">
            <span class="label">السرعة <span lang="en">WPM</span></span>
            <strong id="wpm">0</strong>
          </div>
          <div class="stat-card">
            <span class="label">الدقة</span>
            <strong id="accuracy">100%</strong>
          </div>
          <div class="stat-card">
            <span class="label">الوقت</span>
            <strong id="time">60s</strong>
          </div>
          <div class="stat-card">
            <span class="label">الأخطاء</span>
            <strong id="mistakes">0</strong>
          </div>
        </section>

        <section class="typing-panel" aria-label="التدريب">
          <div class="quote-header">
            <span class="pill" id="mode-label">الوضع: عربي</span>
            <button id="new-test" type="button" class="text-btn">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" />
              </svg>
              نص جديد
            </button>
          </div>

          <div class="progress" aria-hidden="true"><div id="progress-bar" class="progress-bar"></div></div>

          <div id="quote" class="quote-box rtl"></div>

          <label class="input-label" for="typing-input">اكتب النص أعلاه هنا</label>
          <textarea
            id="typing-input"
            class="typing-input"
            placeholder="ابدأ الكتابة هنا..."
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            dir="rtl"
          ></textarea>

          <p id="result" class="result" role="status" hidden></p>

          <div class="action-row">
            <button id="start-btn" class="primary-btn" type="button">ابدأ الآن</button>
            <button id="reset-btn" class="ghost-btn" type="button">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5" />
              </svg>
              إعادة الضبط
            </button>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
